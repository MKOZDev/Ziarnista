packages:
  - apps/*
  - packages/*

# Dependencies allowed to run install scripts (pnpm blocks them by default)
allowBuilds:
  '@prisma/engines': true
  '@swc/core': true
  prisma: true
  # Usage telemetry pulled in by swagger-ui-dist; not needed
  '@scarf/scarf': false
  # Pulled in by tsx; the binary comes from @esbuild/<platform>, the script only verifies it
  esbuild: false
